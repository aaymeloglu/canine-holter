name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The GUI module imports tkinter at load time and a couple of tests
      # exercise its file-picker logic, so give the runner a virtual display
      # rather than requiring one. xvfb-run is a no-op for the non-GUI tests.
      - name: Run tests
        run: xvfb-run -a pytest -q
